[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nfl_fantasy_ml_ai"
version = "0.1.0"
description = "NFL fantasy mlops project 1.0 - Predictive Analytics & GenAI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.6",
    "pydantic-settings>=2.4",    # <-- agregado: necesario para config.py de FastAPI
    "pyyaml>=6.0",
    "polars>=1.6",
    "numpy>=1.26",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "joblib>=1.3",
    "pandas>=2.0",
    "nflreadpy",
    "ipykernel>=6.0",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "pyarrow>=15.0",
    # --- Gen AI Stack ---
    "langchain>=0.1",
    "langchain-openai",
    "python-dotenv",
    "openai",
    # --- MLOps & Experiment Tracking ---
    "mlflow>=2.10",
    "loguru",
    "streamlit>=1.55.0",
    "plotly>=6.6.0",
]

[project.optional-dependencies]
# Instalar con: uv sync --extra web
web = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "streamlit>=1.38",
    "plotly>=5.24",
    "requests>=2.32",
]
dev = [
    "ruff>=0.6.9",
    "mypy>=1.12",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pre-commit>=3.7",
    "nbqa>=1.8",
    "jupytext",
    "types-PyYAML",
    "types-requests",
]
types = [
    "types-PyYAML",
    "types-requests",
    "types-setuptools",
]
# Instalar todo de una: uv sync --extra web --extra dev
all = [
    "nfl_fantasy_ml_ai[web]",
    "nfl_fantasy_ml_ai[dev]",
]

# ── uv ────────────────────────────────────────────────────────────────────────
[tool.uv]
# Fuente principal de paquetes
index-url = "https://pypi.org/simple"

# nflreadpy no siempre tiene wheel en PyPI, esto evita errores de build
no-build-isolation-package = ["nflreadpy"]

# ── setuptools ────────────────────────────────────────────────────────────────
[tool.setuptools.packages.find]
where = ["src"]

# ── ruff ──────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C90"]
ignore = ["E203"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ── mypy ──────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_optional = true
ignore_missing_imports = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = [
    "torch",
    "torch.*",
    "joblib",
    "sklearn",
    "sklearn.*",
    "nflreadpy.*",
    "mlflow.*",
    "polars.*",
    "nfl_data_py.*",
    # agregados: librerías web sin stubs
    "streamlit.*",
    "plotly.*",
    "uvicorn.*",
]
ignore_missing_imports = true

# ── pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=src --cov-report=term-missing"
